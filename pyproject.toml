[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mapkg"
version = "0.1.0"
description = "Natural-language map queries: OpenStreetMap as an RDF knowledge graph, queried with SPARQL via an LLM, exposed over MCP."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "rdflib>=7.0",
    "geopandas>=0.14",
    "shapely>=2.0",
    "pyproj>=3.6",
    "mcp>=1.2",
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
mapkg = "mapkg.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
