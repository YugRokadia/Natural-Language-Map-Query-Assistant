<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Pipeline: question, LLM translator, read-only validator, RDF graph, rows plus SPARQL, MCP tools. Validator errors retry up to twice." xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <style>
      .t{font-family:Inter,'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif}
      .m{font-family:'JetBrains Mono','SF Mono',SFMono-Regular,Menlo,Consolas,monospace}
      @keyframes flow{to{stroke-dashoffset:-20}}
      .f{animation:flow 1.1s linear infinite}
      .r{animation:flow 1.6s linear infinite reverse}
      @keyframes glow{0%,100%{opacity:.0}50%{opacity:.35}}
    </style>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1L9 5L0 9z" fill="#5F89AE"/></marker>
    <marker id="aa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1L9 5L0 9z" fill="#FFB454"/></marker>
  </defs>
  <rect width="1200" height="320" rx="22" fill="#0A1424"/>
  <rect x=".75" y=".75" width="1198.5" height="318.5" rx="21.5" fill="none" stroke="#2C5679" stroke-opacity=".7"/>
  <!-- main track -->
  <path d="M105 150H1095" stroke="#2A5075" stroke-width="2" stroke-dasharray="6 6" class="f" fill="none"/>
  <g fill="#3FD0C9">
    <circle r="5"><animateMotion dur="7s" repeatCount="indefinite" path="M105 150H1095"/></circle>
    <circle r="5"><animateMotion dur="7s" begin="-2.33s" repeatCount="indefinite" path="M105 150H1095"/></circle>
    <circle r="5"><animateMotion dur="7s" begin="-4.66s" repeatCount="indefinite" path="M105 150H1095"/></circle>
  </g>
  <!-- retry arc -->
  <path d="M501 108C501 36 303 36 303 106" fill="none" stroke="#FFB454" stroke-width="2" stroke-dasharray="5 6" class="r" marker-end="url(#aa)"/>
  <circle r="4.5" fill="#FFB454"><animateMotion dur="3.2s" repeatCount="indefinite" path="M501 108C501 36 303 36 303 106"/></circle>
  <text x="402" y="38" text-anchor="middle" class="t" font-size="13" fill="#FFD9A3">parse or runtime error: retry up to 2×</text>
  <!-- support links -->
  <g stroke="#5F89AE" stroke-width="1.6" stroke-dasharray="4 5" class="f" fill="none" marker-end="url(#a)">
    <path d="M303 242V194"/><path d="M501 242V194"/><path d="M699 242V194"/>
  </g>
  <!-- nodes -->
  <g class="t" text-anchor="middle">
    <g><rect x="30" y="110" width="150" height="80" rx="14" fill="#0E2A3F" stroke="#3FD0C9"/><text x="105" y="145" font-size="16" font-weight="700" fill="#EAF4FF">Question</text><text x="105" y="168" font-size="12.5" fill="#8FAECB">plain English</text></g>
    <g><rect x="228" y="110" width="150" height="80" rx="14" fill="#241B45" stroke="#9B7BFF"/><text x="303" y="145" font-size="16" font-weight="700" fill="#EAF4FF">LLM translator</text><text x="303" y="168" font-size="12.5" fill="#B9A4FF">writes SPARQL</text></g>
    <g><rect x="426" y="110" width="150" height="80" rx="14" fill="#3A2A12" stroke="#FFB454"/><text x="501" y="145" font-size="16" font-weight="700" fill="#EAF4FF">Validator</text><text x="501" y="168" font-size="12.5" fill="#FFD9A3">SELECT · ASK only</text></g>
    <g><rect x="624" y="110" width="150" height="80" rx="14" fill="#0E2A3F" stroke="#3FD0C9"/><text x="699" y="145" font-size="16" font-weight="700" fill="#EAF4FF">RDF graph</text><text x="699" y="168" font-size="12.5" fill="#7FE3DC">rdflib + geof:*</text></g>
    <g><rect x="822" y="110" width="150" height="80" rx="14" fill="#0E2A3F" stroke="#3FD0C9"/><text x="897" y="145" font-size="16" font-weight="700" fill="#EAF4FF">Rows + SPARQL</text><text x="897" y="168" font-size="12.5" fill="#7FE3DC">answer you can audit</text></g>
    <g><rect x="1020" y="110" width="150" height="80" rx="14" fill="#241B45" stroke="#9B7BFF"/><text x="1095" y="145" font-size="16" font-weight="700" fill="#EAF4FF">MCP tools</text><text x="1095" y="168" font-size="12.5" fill="#B9A4FF">Claude calls them</text></g>
  </g>
  <!-- pills -->
  <g class="t" text-anchor="middle">
    <rect x="213" y="244" width="180" height="50" rx="12" fill="#10243B" stroke="#2C5679"/><text x="303" y="265" font-size="13" font-weight="600" fill="#DCEBFA">Schema prompt</text><text x="303" y="283" font-size="12" fill="#8FAECB">generated from the graph</text>
    <rect x="411" y="244" width="180" height="50" rx="12" fill="#10243B" stroke="#2C5679"/><text x="501" y="265" font-size="13" font-weight="600" fill="#DCEBFA">Rule engine</text><text x="501" y="283" font-size="12" fill="#8FAECB">offline fallback</text>
    <rect x="609" y="244" width="180" height="50" rx="12" fill="#10243B" stroke="#2C5679"/><text x="699" y="265" font-size="13" font-weight="600" fill="#DCEBFA">OSM GeoJSON</text><text x="699" y="283" font-size="12" fill="#8FAECB">GeoPandas + Shapely</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
