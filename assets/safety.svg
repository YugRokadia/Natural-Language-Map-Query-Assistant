<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="Model-written queries reach a read-only validator. SELECT and ASK pass to the graph; INSERT and SERVICE are rejected." xmlns:c2pa="http://c2pa.org/manifest">
<defs><style>
.t{font-family:Inter,'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif}
.m{font-family:'JetBrains Mono','SF Mono',SFMono-Regular,Menlo,Consolas,monospace}
@keyframes pass{0%{transform:translateX(0);opacity:0}6%{opacity:1}34%{transform:translateX(190px)}46%{transform:translateX(190px)}78%{transform:translateX(790px);opacity:1}86%,100%{transform:translateX(830px);opacity:0}}
@keyframes block{0%{transform:translateX(0);opacity:0}6%{opacity:1}34%{transform:translateX(190px)}40%{transform:translateX(184px)}43%{transform:translateX(196px)}46%{transform:translateX(190px)}66%{transform:translateX(190px);opacity:1}76%,100%{transform:translateX(150px);opacity:0}}
@keyframes red{0%,40%{stroke:#5F89AE;fill:#10243B}48%,100%{stroke:#FF6B6B;fill:#3A1620}}
@keyframes green{0%,40%{stroke:#5F89AE}48%,100%{stroke:#3FD0C9}}
@keyframes markB{0%,43%{opacity:0}48%,66%{opacity:1}74%,100%{opacity:0}}
@keyframes markP{0%,36%{opacity:0}42%,52%{opacity:1}60%,100%{opacity:0}}
@keyframes flow{to{stroke-dashoffset:-20}}
.f{animation:flow 1.1s linear infinite}
.chip{animation-duration:9s;animation-iteration-count:infinite;animation-timing-function:ease-in-out;animation-fill-mode:backwards}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.chip{opacity:1}}
</style></defs>
<rect width="1200" height="400" rx="22" fill="#0A1424"/><rect x=".75" y=".75" width="1198.5" height="398.5" rx="21.5" fill="none" stroke="#2C5679" stroke-opacity=".7"/>
<g class="t" font-size="14" font-weight="600" fill="#8FAECB" text-anchor="middle"><text x="180" y="40">Untrusted: written by the model</text><text x="560" y="40" fill="#FFD9A3">Read-only validator</text><text x="1010" y="40" fill="#7FE3DC">In-memory graph</text></g>
<!-- gate -->
<rect x="538" y="56" width="44" height="288" rx="14" fill="#3A2A12" fill-opacity=".55" stroke="#FFB454"/>
<path d="M560 62V338" stroke="#FFB454" stroke-opacity=".6" stroke-dasharray="4 6" class="f" fill="none"/>
<!-- graph cylinder -->
<g transform="translate(920 120)"><path d="M0 24V150C0 176 180 176 180 150V24" fill="#0E2A3F" stroke="#3FD0C9"/><ellipse cx="90" cy="24" rx="90" ry="22" fill="#12384F" stroke="#3FD0C9"/>
<g fill="none" stroke="#3FD0C9" stroke-opacity=".45"><path d="M0 70C0 96 180 96 180 70"/><path d="M0 110C0 136 180 136 180 110"/></g>
<g transform="translate(78 62)"><rect x="0" y="14" width="24" height="20" rx="4" fill="#FFB454"/><path d="M5 14V9a7 7 0 0 1 14 0v5" fill="none" stroke="#FFB454" stroke-width="3"/></g>
<text x="90" y="130" text-anchor="middle" class="t" font-size="13" font-weight="600" fill="#BFF5F1">no writes. no network.</text></g>
<g class="chip" style="animation-name:pass;animation-delay:0s" opacity="0"><rect x="30" y="70" width="320" height="46" rx="12" fill="#10243B" stroke="#5F89AE" stroke-width="1.6" class="chip" style="animation-name:green;animation-delay:0s"/><text x="50" y="99" class="m" font-size="15" fill="#E8F3FF">SELECT ?cafe WHERE { … }</text></g>
<g style="animation:markP 9s 0s infinite backwards" opacity="0"><circle cx="560" cy="93" r="14" fill="#0E2A3F" stroke="#3FD0C9" stroke-width="2"/><path d="M553 93l5 5 9-10" fill="none" stroke="#3FD0C9" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></g>
<g class="chip" style="animation-name:block;animation-delay:2.2s" opacity="0"><rect x="30" y="135" width="320" height="46" rx="12" fill="#10243B" stroke="#5F89AE" stroke-width="1.6" class="chip" style="animation-name:red;animation-delay:2.2s"/><text x="50" y="164" class="m" font-size="15" fill="#E8F3FF">INSERT DATA { … }</text></g>
<g style="animation:markB 9s 2.2s infinite backwards" opacity="0"><circle cx="560" cy="158" r="14" fill="#3A1620" stroke="#FF6B6B" stroke-width="2"/><path d="M554 152l12 12M566 152l-12 12" stroke="#FF6B6B" stroke-width="2.6" stroke-linecap="round"/><text x="604" y="163" class="t" font-size="14" font-weight="600" fill="#FF9E9E">rejected: updates not allowed</text></g>
<g class="chip" style="animation-name:block;animation-delay:4.4s" opacity="0"><rect x="30" y="200" width="320" height="46" rx="12" fill="#10243B" stroke="#5F89AE" stroke-width="1.6" class="chip" style="animation-name:red;animation-delay:4.4s"/><text x="50" y="229" class="m" font-size="15" fill="#E8F3FF">SERVICE &lt;http://…&gt; { … }</text></g>
<g style="animation:markB 9s 4.4s infinite backwards" opacity="0"><circle cx="560" cy="223" r="14" fill="#3A1620" stroke="#FF6B6B" stroke-width="2"/><path d="M554 217l12 12M566 217l-12 12" stroke="#FF6B6B" stroke-width="2.6" stroke-linecap="round"/><text x="604" y="228" class="t" font-size="14" font-weight="600" fill="#FF9E9E">rejected: SERVICE not allowed</text></g>
<g class="chip" style="animation-name:pass;animation-delay:6.6s" opacity="0"><rect x="30" y="265" width="320" height="46" rx="12" fill="#10243B" stroke="#5F89AE" stroke-width="1.6" class="chip" style="animation-name:green;animation-delay:6.6s"/><text x="50" y="294" class="m" font-size="15" fill="#E8F3FF">ASK { ?f mk:kind "park" }</text></g>
<g style="animation:markP 9s 6.6s infinite backwards" opacity="0"><circle cx="560" cy="288" r="14" fill="#0E2A3F" stroke="#3FD0C9" stroke-width="2"/><path d="M553 288l5 5 9-10" fill="none" stroke="#3FD0C9" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></g>
<g class="m" font-size="13" fill="#7F9FBE"><text x="40" y="378">row cap: 100 default, 500 hard max</text><text x="470" y="378">bad SPARQL: error goes back to the model, 2 retries</text><text x="920" y="378">outage: offline rule engine</text></g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>