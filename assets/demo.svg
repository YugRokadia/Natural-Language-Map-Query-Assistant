<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" role="img" aria-label="Terminal demo: mapkg ask 'Which cafes are within 1 km of NMIMS?' prints SPARQL and a table of three cafes at 86 m, 305 m and 756 m." xmlns:c2pa="http://c2pa.org/manifest">
<defs><clipPath id="ty"><rect x="64" y="70" width="0" height="34"><animate attributeName="width" dur="15s" repeatCount="indefinite" keyTimes="0;.03;.15;1" values="0;0;520;520"/></rect></clipPath>
<style>.m{font-family:'JetBrains Mono','SF Mono',SFMono-Regular,Menlo,Consolas,monospace}.t{font-family:Inter,'Segoe UI',system-ui,sans-serif}
@keyframes cur{0%,49%{opacity:1}50%,100%{opacity:0}}.cur{animation:cur 1s infinite}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style></defs>
<rect width="1000" height="500" rx="18" fill="#0A1424"/><rect x=".75" y=".75" width="998.5" height="498.5" rx="17.5" fill="none" stroke="#2C5679"/>
<path d="M1 18a17 17 0 0 1 17-17h964a17 17 0 0 1 17 17V44H1z" fill="#10243B"/>
<circle cx="28" cy="23" r="6" fill="#FF6B6B"/><circle cx="50" cy="23" r="6" fill="#FFB454"/><circle cx="72" cy="23" r="6" fill="#3FD0C9"/>
<text x="500" y="28" text-anchor="middle" class="t" font-size="13" fill="#6F91B1">mapkg · ask</text>
<g class="m" font-size="15.5">
<text x="30" y="93" fill="#FFB454" font-weight="700">$</text>
<g clip-path="url(#ty)"><text x="50" y="93" fill="#EAF4FF">mapkg ask "Which cafes are within 1 km of NMIMS?"</text></g>
<text x="30" y="128" fill="#6F91B1" opacity="0" ><animate attributeName="opacity" dur="15s" repeatCount="indefinite" keyTimes="0;0.2133;0.2233;.95;1" values="0;0;1;1;0"/>engine: rules (offline), no API key needed</text>
<text x="30" y="166" fill="#7FE3DC" opacity="0" font-weight="700"><animate attributeName="opacity" dur="15s" repeatCount="indefinite" keyTimes="0;0.2800;0.2900;.95;1" values="0;0;1;1;0"/>SPARQL</text>
<text x="30" y="192" fill="#C9B9FF" opacity="0" ><animate attributeName="opacity" dur="15s" repeatCount="indefinite" keyTimes="0;0.3067;0.3167;.95;1" values="0;0;1;1;0"/>SELECT ?name ?metres WHERE {</text>
<text x="30" y="216" fill="#B7CCE2" opacity="0" ><animate attributeName="opacity" dur="15s" repeatCount="indefinite" keyTimes="0;0.3400;0.3500;.95;1" values="0;0;1;1;0"/>  ?f mk:kind "cafe" ; rdfs:label ?name ; geo:hasGeometry/geo:asWKT ?w .</text>
<text x="30" y="240" fill="#B7CCE2" opacity="0" ><animate attributeName="opacity" dur="15s" repeatCount="indefinite" keyTimes="0;0.3733;0.3833;.95;1" values="0;0;1;1;0"/>  FILTER(geof:distance(?w, ?anchor) &lt;= 1000)</text>
<text x="30" y="264" fill="#C9B9FF" opacity="0" ><animate attributeName="opacity" dur="15s" repeatCount="indefinite" keyTimes="0;0.4067;0.4167;.95;1" values="0;0;1;1;0"/>} ORDER BY ?metres</text>
<g opacity="0"><animate attributeName="opacity" dur="15s" repeatCount="indefinite" keyTimes="0;0.4800;0.4900;.95;1" values="0;0;1;1;0"/><rect x="30" y="300" width="560" height="148" rx="12" fill="#0E1D32" stroke="#2C5679"/><path d="M30 336H590" stroke="#2C5679"/><text x="52" y="324" fill="#7FE3DC" font-weight="700">name</text><text x="560" y="324" fill="#7FE3DC" font-weight="700" text-anchor="end">metres</text></g>
<g opacity="0"><animate attributeName="opacity" dur="15s" repeatCount="indefinite" keyTimes="0;0.5333;0.5433;.95;1" values="0;0;1;1;0"/><text x="52" y="366" fill="#EAF4FF">Sample Cafe VP1</text><text x="560" y="366" fill="#FFD9A3" text-anchor="end" font-weight="700">86</text><rect x="52" y="374" width="66" height="3" rx="1.5" fill="#3FD0C9" opacity=".55"/></g>
<g opacity="0"><animate attributeName="opacity" dur="15s" repeatCount="indefinite" keyTimes="0;0.5867;0.5967;.95;1" values="0;0;1;1;0"/><text x="52" y="400" fill="#EAF4FF">Sample Cafe VP2</text><text x="560" y="400" fill="#FFD9A3" text-anchor="end" font-weight="700">305</text><rect x="52" y="408" width="181" height="3" rx="1.5" fill="#3FD0C9" opacity=".55"/></g>
<g opacity="0"><animate attributeName="opacity" dur="15s" repeatCount="indefinite" keyTimes="0;0.6400;0.6500;.95;1" values="0;0;1;1;0"/><text x="52" y="434" fill="#EAF4FF">Sample Cafe VP3</text><text x="560" y="434" fill="#FFD9A3" text-anchor="end" font-weight="700">756</text><rect x="52" y="442" width="420" height="3" rx="1.5" fill="#3FD0C9" opacity=".55"/></g>
<text x="30" y="474" fill="#3FD0C9" opacity="0" font-weight="700"><animate attributeName="opacity" dur="15s" repeatCount="indefinite" keyTimes="0;0.7333;0.7433;.95;1" values="0;0;1;1;0"/>✓ 3 rows. The SPARQL comes back with every answer.</text>
<rect x="30" y="74" width="9" height="18" fill="#EAF4FF" class="cur" opacity="0"><animate attributeName="opacity" dur="15s" repeatCount="indefinite" keyTimes="0;.01;.9;1" values="0;0;0;0"/></rect></g><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>