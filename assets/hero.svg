<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 480" width="1280" height="480" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">mapkg: ask your map anything</title>
  <desc id="d">An animated sonar ring sweeps a chart-style map and reveals cafes at 86, 305 and 756 metres while example questions cycle on the left.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0A1424"/><stop offset="1" stop-color="#10233B"/></linearGradient>
    <radialGradient id="glow" cx="960" cy="240" r="260" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#3FD0C9" stop-opacity=".18"/><stop offset="1" stop-color="#3FD0C9" stop-opacity="0"/></radialGradient>
    <linearGradient id="ttl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#9FE9E4"/></linearGradient>
    <clipPath id="c1"><rect x="76" y="326" width="0" height="40"><animate attributeName="width" dur="12s" repeatCount="indefinite" keyTimes="0;.02;.2;.32;1" values="0;0;420;420;0"/></rect></clipPath>
    <clipPath id="c2"><rect x="76" y="326" width="0" height="40"><animate attributeName="width" dur="12s" repeatCount="indefinite" keyTimes="0;.35;.53;.65;1" values="0;0;420;420;0"/></rect></clipPath>
    <clipPath id="c3"><rect x="76" y="326" width="0" height="40"><animate attributeName="width" dur="12s" repeatCount="indefinite" keyTimes="0;.68;.84;.97;1" values="0;0;420;420;0"/></rect></clipPath>
    <clipPath id="frame"><rect x="0" y="0" width="1280" height="480" rx="24"/></clipPath>
    <style>
      .t{font-family:Inter,'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif}
      .m{font-family:'JetBrains Mono','SF Mono',SFMono-Regular,Menlo,Consolas,monospace}
      @keyframes drift{from{stroke-dashoffset:0}to{stroke-dashoffset:-40}}
      .route{animation:drift 3s linear infinite}
      @media (prefers-reduced-motion:reduce){*{animation:none!important}}
    </style>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1280" height="480" fill="url(#bg)"/>
    <rect width="1280" height="480" fill="url(#glow)"/>
    <!-- chart grid -->
    <g stroke="#1B3350" stroke-width="1" opacity=".7">
      <path d="M700 0V480M780 0V480M860 0V480M940 0V480M1020 0V480M1100 0V480M1180 0V480M1260 0V480"/>
      <path d="M640 40H1280M640 120H1280M640 200H1280M640 280H1280M640 360H1280M640 440H1280"/>
    </g>
    <!-- contour lines -->
    <g fill="none" stroke="#244768" stroke-width="1.4" opacity=".8">
      <ellipse cx="1090" cy="120" rx="150" ry="70" transform="rotate(-18 1090 120)"/>
      <ellipse cx="1090" cy="120" rx="108" ry="46" transform="rotate(-18 1090 120)"/>
      <ellipse cx="1090" cy="120" rx="66" ry="24" transform="rotate(-18 1090 120)"/>
      <ellipse cx="800" cy="400" rx="170" ry="64" transform="rotate(12 800 400)"/>
      <ellipse cx="800" cy="400" rx="120" ry="40" transform="rotate(12 800 400)"/>
      <ellipse cx="800" cy="400" rx="70" ry="18" transform="rotate(12 800 400)"/>
    </g>
    <!-- roads -->
    <g fill="none" stroke-linecap="round">
      <path d="M640 330 C760 300 860 330 960 240 S1160 160 1280 190" stroke="#2C5679" stroke-width="7" opacity=".55"/>
      <path d="M640 330 C760 300 860 330 960 240 S1160 160 1280 190" stroke="#3FD0C9" stroke-width="1.6" stroke-dasharray="10 10" class="route" opacity=".8"/>
      <path d="M960 0 C940 120 990 180 960 240 S930 380 970 480" stroke="#244768" stroke-width="5" opacity=".7"/>
      <path d="M700 80 L960 240 L1240 400" stroke="#1F3E5E" stroke-width="3" opacity=".8"/>
    </g>
    <!-- sonar rings -->
    <g fill="none" stroke="#3FD0C9">
      <circle cx="960" cy="240" r="10" stroke-width="2"><animate attributeName="r" dur="6s" repeatCount="indefinite" values="10;190"/><animate attributeName="opacity" dur="6s" repeatCount="indefinite" values=".9;0"/></circle>
      <circle cx="960" cy="240" r="10" stroke-width="1.2"><animate attributeName="r" dur="6s" begin="-3s" repeatCount="indefinite" values="10;190"/><animate attributeName="opacity" dur="6s" begin="-3s" repeatCount="indefinite" values=".6;0"/></circle>
      <circle cx="960" cy="240" r="190" stroke-width="1" stroke-dasharray="3 7" opacity=".5"/>
    </g>
    <!-- anchor pin -->
    <circle cx="960" cy="240" r="18" fill="#FFB454" opacity=".18"><animate attributeName="r" dur="2s" repeatCount="indefinite" values="10;22;10"/></circle>
    <circle cx="960" cy="240" r="7" fill="#FFB454" stroke="#0A1424" stroke-width="3"/>
    <text x="974" y="262" class="t" font-size="13" font-weight="600" fill="#FFD9A3">NMIMS</text>
    <!-- results -->
    <g class="t" font-size="13" font-weight="600">
      <g><animate attributeName="opacity" dur="6s" repeatCount="indefinite" keyTimes="0;.18;.23;.93;1" values="0;0;1;1;0"/>
        <circle cx="986" cy="209" r="6" fill="#3FD0C9" stroke="#0A1424" stroke-width="2.5"/>
        <rect x="996" y="182" width="92" height="24" rx="12" fill="#0E2A3F" stroke="#3FD0C9" stroke-opacity=".6"/><text x="1010" y="199" fill="#BFF5F1">VP1 · 86 m</text></g>
      <g><animate attributeName="opacity" dur="6s" repeatCount="indefinite" keyTimes="0;.52;.57;.93;1" values="0;0;1;1;0"/>
        <circle cx="1055" cy="284" r="6" fill="#3FD0C9" stroke="#0A1424" stroke-width="2.5"/>
        <rect x="1065" y="290" width="104" height="24" rx="12" fill="#0E2A3F" stroke="#3FD0C9" stroke-opacity=".6"/><text x="1078" y="307" fill="#BFF5F1">VP2 · 305 m</text></g>
      <g><animate attributeName="opacity" dur="6s" repeatCount="indefinite" keyTimes="0;.88;.93;.97;1" values="0;0;1;1;0"/>
        <circle cx="796" cy="180" r="6" fill="#3FD0C9" stroke="#0A1424" stroke-width="2.5"/>
        <rect x="690" y="140" width="104" height="24" rx="12" fill="#0E2A3F" stroke="#3FD0C9" stroke-opacity=".6"/><text x="703" y="157" fill="#BFF5F1">VP3 · 756 m</text></g>
    </g>
    <!-- left fade so text stays legible -->
    <rect width="700" height="480" fill="url(#bg)" opacity=".55"/>
    <!-- badges -->
    <g class="t" font-size="12.5" font-weight="600">
      <rect x="64" y="52" width="86" height="26" rx="13" fill="#162B45" stroke="#2C5679"/><text x="107" y="69" text-anchor="middle" fill="#9FC3E4">MCP server</text>
      <rect x="158" y="52" width="92" height="26" rx="13" fill="#162B45" stroke="#2C5679"/><text x="204" y="69" text-anchor="middle" fill="#9FC3E4">SPARQL 1.1</text>
      <rect x="258" y="52" width="108" height="26" rx="13" fill="#162B45" stroke="#2C5679"/><text x="312" y="69" text-anchor="middle" fill="#9FC3E4">GeoSPARQL</text>
      <rect x="374" y="52" width="92" height="26" rx="13" fill="#162B45" stroke="#2C5679"/><text x="420" y="69" text-anchor="middle" fill="#9FC3E4">Python 3.10+</text>
    </g>
    <!-- title -->
    <text x="62" y="176" class="t" font-size="96" font-weight="800" letter-spacing="-4" fill="url(#ttl)">mapkg</text>
    <text x="66" y="226" class="t" font-size="30" font-weight="600" fill="#DCEBFA">Ask your map anything.</text>
    <text x="66" y="262" class="t" font-size="17" fill="#8FAECB">OpenStreetMap as an RDF knowledge graph.</text>
    <text x="66" y="287" class="t" font-size="17" fill="#8FAECB">An LLM writes the SPARQL. Served over MCP.</text>
    <!-- question pill -->
    <rect x="62" y="326" width="500" height="40" rx="20" fill="#0D1B2E" stroke="#3FD0C9" stroke-opacity=".7"/>
    <text x="80" y="352" class="m" font-size="16" font-weight="700" fill="#FFB454">›</text>
    <g class="m" font-size="15.5" fill="#E8F3FF">
      <g opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0;.02;.3;.33;1" values="0;1;1;0;0"/><g clip-path="url(#c1)"><text x="98" y="352">Which cafes are within 1 km of NMIMS?</text></g></g>
      <g opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0;.35;.36;.63;.66;1" values="0;0;1;1;0;0"/><g clip-path="url(#c2)"><text x="98" y="352">Nearest pharmacy to NMIMS Mumbai Campus</text></g></g>
      <g opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0;.68;.69;.96;.99;1" values="0;0;1;1;0;0"/><g clip-path="url(#c3)"><text x="98" y="352">Hospitals within 3 km of Bandra</text></g></g>
    </g>
    <text x="66" y="404" class="t" font-size="13.5" fill="#6F91B1">Every answer ships with the exact SPARQL that produced it.</text>
    <rect x=".75" y=".75" width="1278.5" height="478.5" rx="23.5" fill="none" stroke="#2C5679" stroke-opacity=".7"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
