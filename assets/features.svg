<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" width="1200" height="290" role="img" aria-label="Three capabilities: map to knowledge graph, question to SPARQL, graph to MCP tools" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#112239"/><stop offset="1" stop-color="#0C1A2D"/></linearGradient>
    <style>
      .t{font-family:Inter,'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif}
      .m{font-family:'JetBrains Mono','SF Mono',SFMono-Regular,Menlo,Consolas,monospace}
      @keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}
      .d1{animation:blink 1.4s infinite}.d2{animation:blink 1.4s .25s infinite}.d3{animation:blink 1.4s .5s infinite}
      @keyframes flow{to{stroke-dashoffset:-16}}
      .f{animation:flow 1.2s linear infinite}
    </style>
  </defs>
  <g class="t">
    <!-- card 1 -->
    <rect x="20" y="20" width="360" height="250" rx="18" fill="url(#card)" stroke="#2C5679"/>
    <g transform="translate(48 50)">
      <rect width="56" height="56" rx="14" fill="#0E2A3F" stroke="#3FD0C9" stroke-opacity=".5"/>
      <g stroke="#3FD0C9" stroke-width="1.6" stroke-dasharray="4 4" class="f" fill="none"><path d="M16 38L28 18L42 36M28 18V10"/></g>
      <circle cx="16" cy="38" r="4" fill="#3FD0C9"/><circle cx="42" cy="36" r="4" fill="#3FD0C9"/>
      <circle cx="28" cy="18" r="5" fill="#FFB454"><animate attributeName="r" values="4;6.5;4" dur="2s" repeatCount="indefinite"/></circle>
    </g>
    <text x="122" y="86" font-size="21" font-weight="700" fill="#EAF4FF">Map to knowledge graph</text>
    <g font-size="14.5" fill="#9DB8D2"><text x="48" y="136">GeoPandas and Shapely turn OSM GeoJSON</text><text x="48" y="158">into RDF with GeoSPARQL-style geometries,</text><text x="48" y="180">tag triples, and precomputed lengths</text><text x="48" y="202">and areas.</text></g>
    <rect x="48" y="224" width="148" height="26" rx="13" fill="#0E2A3F" stroke="#2C5679"/><text x="122" y="241" text-anchor="middle" class="m" font-size="12" fill="#7FE3DC">mk:Feature · geo:Feature</text>
    <!-- card 2 -->
    <rect x="420" y="20" width="360" height="250" rx="18" fill="url(#card)" stroke="#2C5679"/>
    <g transform="translate(448 50)">
      <rect width="56" height="56" rx="14" fill="#241B45" stroke="#9B7BFF" stroke-opacity=".55"/>
      <path d="M12 16h32a4 4 0 0 1 4 4v14a4 4 0 0 1-4 4H26l-8 7v-7h-6a4 4 0 0 1-4-4V20a4 4 0 0 1 4-4z" transform="translate(0 -2)" fill="none" stroke="#B9A4FF" stroke-width="1.8"/>
      <circle class="d1" cx="19" cy="26" r="3" fill="#B9A4FF"/><circle class="d2" cx="28" cy="26" r="3" fill="#B9A4FF"/><circle class="d3" cx="37" cy="26" r="3" fill="#B9A4FF"/>
    </g>
    <text x="522" y="86" font-size="21" font-weight="700" fill="#EAF4FF">Question to SPARQL</text>
    <g font-size="14.5" fill="#9DB8D2"><text x="448" y="136">An LLM gets a schema prompt generated</text><text x="448" y="158">from your data, writes the query, and retries</text><text x="448" y="180">with the parser's error. An offline rule</text><text x="448" y="202">engine covers the common shapes.</text></g>
    <rect x="448" y="224" width="176" height="26" rx="13" fill="#241B45" stroke="#5B47A8"/><text x="536" y="241" text-anchor="middle" class="m" font-size="12" fill="#C9B9FF">retry with parser error</text>
    <!-- card 3 -->
    <rect x="820" y="20" width="360" height="250" rx="18" fill="url(#card)" stroke="#2C5679"/>
    <g transform="translate(848 50)">
      <rect width="56" height="56" rx="14" fill="#3A2A12" stroke="#FFB454" stroke-opacity=".55"/>
      <g stroke="#FFB454" stroke-width="1.6" fill="none" stroke-dasharray="4 4" class="f"><path d="M28 28L12 14M28 28L44 14M28 28V46"/></g>
      <circle cx="12" cy="14" r="4" fill="#FFB454"/><circle cx="44" cy="14" r="4" fill="#FFB454"/><circle cx="28" cy="46" r="4" fill="#FFB454"/>
      <circle cx="28" cy="28" r="6" fill="#FFD9A3"><animate attributeName="r" values="5;8;5" dur="2s" repeatCount="indefinite"/></circle>
    </g>
    <text x="922" y="86" font-size="21" font-weight="700" fill="#EAF4FF">Graph to MCP tools</text>
    <g font-size="14.5" fill="#9DB8D2"><text x="848" y="136">ask_map, run_sparql, find_nearby, and</text><text x="848" y="158">describe_dataset. Works with MCP SDK v1</text><text x="848" y="180">and v2, over stdio, so Claude can call it</text><text x="848" y="202">as a tool.</text></g>
    <rect x="848" y="224" width="104" height="26" rx="13" fill="#3A2A12" stroke="#8A5F1E"/><text x="900" y="241" text-anchor="middle" class="m" font-size="12" fill="#FFD9A3">stdio · MCP</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
